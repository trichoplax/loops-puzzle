<svg version="1.1"
    width="500"
    height="500"
    xmlns="http://www.w3.org/2000/svg">
    <defs>
        <pattern patternUnits="userSpaceOnUse" x="0" y="0" width="100" height="100" id="grid">
            <rect x="0" y="0" width="100" height="100" fill="none" stroke="grey"  stroke-width="4"/>
        </pattern>
        <g id="single-curve">
            <path d="M 50 100 a 50 50 0 0 1 50 -50" fill="none" stroke="#bb3333" stroke-width="15" />
        </g>
        <g id="double-curve">
            <path d="M 50 100 a 50 50 0 0 1 50 -50" fill="none" stroke="#9933ee" stroke-width="30" />
            <path d="M 50 100 a 50 50 0 0 1 50 -50" fill="none" stroke="#bbddff" stroke-width="20" />
        </g>
        <g id="two-double-curves">
            <use href="#double-curve" />
            <use href="#double-curve" transform="rotate(180 50 50)" />
        </g>
        <g id="both-curves">
            <use href="#single-curve" />
            <use href="#double-curve" transform="rotate(180 50 50)" />
        </g>
        <g id="single-straight">
            <line x1="50" y1="0" x2="50" y2="100" stroke="#bb3333" stroke-width="15" />
        </g>
        <g id="double-straight">
            <line x1="50" y1="0" x2="50" y2="100" stroke="#9933ee" stroke-width="30" />
            <line x1="50" y1="0" x2="50" y2="100" stroke="#bbddff" stroke-width="20" />
        </g>
        <g id="single-behind-double">
            <use href="#single-straight" transform="rotate(90 50 50)" />
            <use href="#double-straight" />
        </g>
        <g id="single-behind-single">
            <use href="#single-straight" transform="rotate(90 50 50)" />
            <use href="#single-straight" />
        </g>
    </defs>
    <rect x="0" y="0" width="500" height="500" fill="url(#grid)" />
    <use href="#single-curve" x="100" />
    <use href="#single-curve" x="200" />
    <use href="#single-curve" x="300" />
    <use href="#single-curve" x="400" />
    <use href="#single-curve" y="100" />
    <use href="#single-curve" x="100" y="100" />
    <use href="#single-curve" x="200" y="100" />
    <use href="#double-curve" x="300" y="100" />
    <use href="#double-curve" x="400" y="100" />
    <use href="#double-curve" y="200" />
    <use href="#double-curve" x="100" y="200" />
    <use href="#double-curve" x="200" y="200" />
    <use href="#double-curve" x="300" y="200" />
    <use href="#double-curve" x="400" y="200" />
    <use href="#two-double-curves" y="300" />
    <use href="#double-straight" x="100" y="300" />
    <use href="#double-straight" x="200" y="300" />
    <use href="#single-behind-double" x="300" y="300" />
    <use href="#single-behind-double" x="400" y="300" />
    <use href="#both-curves" y="400" />
    <use href="#single-behind-single" x="100" y="400" />
    <use href="#single-behind-single" x="200" y="400" />
    <use href="#single-behind-double" x="300" y="400" />
    <use href="#single-behind-double" x="400" y="400" />
</svg>
